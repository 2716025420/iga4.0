font-weight="400">同学资料</text><rect x="160" y="658" width="190" height="65" rx="10" fill="#DDE9ED" stroke="#DDE9ED" stroke-width="2"/><text x="180" y="700" font-size="24" fill="#30485B" font-weight="400">物品收纳</text><text x="165" y="841" font-size="19" fill="#51877F" font-weight="400">随行服务 · 在线</text><text x="410" y="235" font-size="39" fill="#253C52" font-weight="700">经历与成长</text><text x="412" y="272" font-size="20" fill="#6B8390" font-weight="400">属于每一位学生的随身设备</text><text x="151" y="949" font-size="22" fill="#587585" font-weight="400">← 返回上页</text><text x="1260" y="949" font-size="20" fill="#6B8390" font-weight="400">查看资料不消耗活动次数</text><rect x="410" y="308" width="290" height="60" rx="9" fill="#D9ECEB" stroke="#C8D7DE" stroke-width="2"/><text x="430" y="347" font-size="25" fill="#30485B" font-weight="400">经历与回看</text><rect x="720" y="308" width="290" height="60" rx="9" fill="#F7FAFC" stroke="#C8D7DE" stroke-width="2"/><text x="740" y="347" font-size="25" fill="#30485B" font-weight="400">成长记录</text><rect x="410" y="395" width="850" height="470" rx="12" fill="#FFFFFF" stroke="#C8D7DE" stroke-width="2"/><text x="444" y="447" font-size="33" fill="#30485B" font-weight="400">放学后的那条路</text><text x="444" y="486" font-size="23" fill="#758995" font-weight="400">当前进度 0 / 9 段</text><text x="444" y="558" font-size="26" fill="#30485B" font-weight="400">尚未解锁的片段显示待续。</text><text x="444" y="599" font-size="26" fill="#30485B" font-weight="400">已读经历可随时回看，</text><text x="444" y="640" font-size="26" fill="#30485B" font-weight="400">不推进现在的剧情或时间。</text><rect x="1290" y="395" width="460" height="470" rx="12" fill="#E2ECEC" stroke="#C8D7DE" stroke-width="2"/><text x="1325" y="446" font-size="30" fill="#30485B" font-weight="400">最近的训练</text><text x="1325" y="518" font-size="24" fill="#30485B" font-weight="400">暂无训练记录</text><text x="1325" y="557" font-size="24" fill="#30485B" font-weight="400">走完、撤离或失败后，</text><text x="1325" y="596" font-size="24" fill="#30485B" font-weight="400">经历都会留在这里。</text></svg>