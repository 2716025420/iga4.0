font-weight="400">同学资料</text><rect x="160" y="658" width="190" height="65" rx="10" fill="#DDE9ED" stroke="#DDE9ED" stroke-width="2"/><text x="180" y="700" font-size="24" fill="#30485B" font-weight="400">物品收纳</text><text x="165" y="841" font-size="19" fill="#51877F" font-weight="400">随行服务 · 在线</text><text x="410" y="235" font-size="39" fill="#253C52" font-weight="700">我的智能终端</text><text x="412" y="272" font-size="20" fill="#6B8390" font-weight="400">属于每一位学生的随身设备</text><text x="151" y="949" font-size="22" fill="#587585" font-weight="400">← 返回上页</text><text x="1260" y="949" font-size="20" fill="#6B8390" font-weight="400">查看资料不消耗活动次数</text><rect x="410" y="310" width="865" height="238" rx="12" fill="#D6E8EB" stroke="#C8D7DE" stroke-width="2"/><text x="442" y="361" font-size="38" fill="#30485B" font-weight="400">早晨好，学生。</text><text x="444" y="409" font-size="25" fill="#30485B" font-weight="400">今天也一起记录有意义的事。</text><text x="444" y="449" font-size="25" fill="#30485B" font-weight="400">探索、收集，以及尚未说出口的话。</text><text x="445" y="506" font-size="25" fill="#30485B" font-weight="400">体力 120/120    零用钱 320</text><rect x="1300" y="310" width="450" height="238" rx="12" fill="#F6EACD" stroke="#C8D7DE" stroke-width="2"/><text x="1335" y="364" font-size="30" fill="#30485B" font-weight="400">十二星座</text><text x="1335" y="425" font-size="52" fill="#30485B" font-weight="400">0 / 12</text><rect x="1335" y="458" width="370" height="60" rx="9" fill="#F7FAFC" stroke="#C8D7DE" stroke-width="2"/><text x="1355" y="497" font-size="25" fill="#30485B" font-weight="400">打开星座图鉴 →</text><rect x="410" y="579" width="655" height="125" rx="12" fill="#FFFFFF" stroke="#C8D7DE" stroke-width="2"/><text x="440" y="628" font-size="30" fill="#30485B" font-weight="400">行动卡资料</text><text x="440" y="670" font-size="22" fill="#718592" font-weight="400">整理行动前的准备</text><rect x="1095" y="579" width="655" height="125" rx="12" fill="#FFFFFF" stroke="#C8D7DE" stroke-width="2"/><text x="1125" y="628" font-size="30" fill="#30485B" font-weight="400">经历与成长</text><text x="1125" y="670" font-size="22" fill="#718592" font-weight="400">留下今天的足迹</text><rect x="410" y="727" width="655" height="125" rx="12" fill="#FFFFFF" stroke="#C8D7DE" stroke-width="2"/><text x="440" y="776" font-size="30" fill="#30485B" font-weight="400">同学资料</text><text x="440" y="818" font-size="22" fill="#718592" font-weight="400">熟悉彼此的每一天</text><rect x="1095" y="727" width="655" height="125" rx="12" fill="#FFFFFF" stroke="#C8D7DE" stroke-width="2"/><text x="1125" y="776" font-size="30" fill="#30485B" font-weight="400">物品收纳</text><text x="1125" y="818" font-size="22" fill="#718592" font-weight="400">查看材料与补给</text></svg>